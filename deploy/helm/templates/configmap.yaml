{{/* PaySwap — ConfigMap */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payswap.fullname" . }}-config
  namespace: {{ include "payswap.namespace" . }}
  labels:
    {{- include "payswap.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
