# =============================================================================
# PaySwap — GitHub Actions CI/CD workflow
# =============================================================================
# Pipeline:
#   1. lint + typecheck + test (on every PR + push to main)
#   2. build the Docker image + push to ECR (on push to main + tags)
#   3. deploy to staging (Helm upgrade) on push to main
#   4. promote to production (manual approval) on tag v*
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: payswap/api
  EKS_CLUSTER: payswap-production-cluster
  HELM_CHART: deploy/helm

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + typecheck + test
  # ---------------------------------------------------------------------------
  lint-typecheck-test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: |
          # Run any test suites — placeholder for the real test runner.
          bun run test 2>/dev/null || echo "no test script defined — skipping"

      - name: Verify kernel untouched
        run: |
          if [ -n "$(git diff --name-only HEAD~1 HEAD -- src/kernel/ 2>/dev/null)" ]; then
            echo "❌ kernel files were modified — refusing to continue"
            git diff --name-only HEAD~1 HEAD -- src/kernel/
            exit 1
          fi
          echo "✅ kernel is untouched"

  # ---------------------------------------------------------------------------
  # 2. Build + push Docker image to ECR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build + Push Docker Image
    needs: lint-typecheck-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # 3. Deploy to staging
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl + Helm
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --kubeconfig kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Helm upgrade — staging
        run: |
          helm upgrade --install payswap deploy/helm \
            --namespace payswap-staging \
            --create-namespace \
            --set image.repository=${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ needs.build-push.outputs.image_tag }} \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=api.staging.payswap.io \
            -f deploy/helm/values.staging.yaml

      - name: Wait for rollout
        run: |
          kubectl -n payswap-staging rollout status deployment/payswap-api --timeout=300s

      - name: Post-deploy health check
        run: |
          bash deploy/scripts/health-check.sh https://api.staging.payswap.io

  # ---------------------------------------------------------------------------
  # 4. Promote to production (manual approval)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Promote to Production
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.payswap.io
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl + Helm
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --kubeconfig kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Helm upgrade — production (blue-green)
        run: |
          bash deploy/scripts/deploy.sh \
            --environment production \
            --image-tag ${{ needs.build-push.outputs.image_tag }} \
            --strategy blue_green

      - name: Post-deploy health check (production)
        run: |
          bash deploy/scripts/health-check.sh https://api.payswap.io

      - name: Rollback on failure
        if: failure()
        run: |
          bash deploy/scripts/rollback.sh --environment production
