# =============================================================================
# PaySwap — Kubernetes Secret (base64-encoded placeholders)
# =============================================================================
# Placeholder secret for development / staging. In production, populate
# from a real secret manager (Vault, AWS Secrets Manager, Sealed Secrets,
# or external-secrets). The values below are base64-encoded empty
# strings — replace them before applying to a real cluster.
#
# Generate a base64-encoded value:
#   echo -n 'my-secret-value' | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: payswap-secrets
  namespace: payswap
  labels:
    app.kubernetes.io/name: payswap
type: Opaque
data:
  # Database URL — full Prisma connection string.
  # echo -n 'postgresql://payswap_app:PASSWORD@HOST:5432/payswap?schema=public' | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3BheXN3YXBfYXBwOlBBU1NXT1JEQEhPU1Q6NTQzMi9wYXlzd2FwP3NjaGVtYT1wdWJsaWM=

  # Redis URL — full connection string (with password if auth is enabled).
  REDIS_URL: cmVkaXM6Ly9wYXlzd2FwLXJlZGlzOjYzNzk=

  # Vault token (for the SecretManager's VaultSecretProvider).
  VAULT_TOKEN: ""

  # Connector API keys (live mode — leave empty in simulation mode).
  OPEN_BANKING_API_KEY: ""
  MPESA_API_KEY: ""
  MPESA_SECRET: ""
  STELLAR_HORIZON_URL: aHR0cHM6Ly9ob3Jpem9uLnN0ZWxsYXJ0Lm9yZw==
  ETHEREUM_RPC_URL: aHR0cHM6Ly9tYWlubmV0LmluZml1cmEuaW8vdjk=
  ETHEREUM_RPC_API_KEY: ""

  # Compliance provider keys.
  TRM_LABS_API_KEY: ""
  CHAINALYSIS_API_KEY: ""

  # Treasury / wallet encryption keys.
  WALLET_ENCRYPTION_KEY: ""
  TREASURY_MASTER_KEY: ""

  # Webhook signing secret.
  WEBHOOK_SIGNING_SECRET: ""

  # Next.js auth secret (for cookies / JWT signing).
  NEXTAUTH_SECRET: ""
