# PaySwap CI
#
# Two-tier design, deliberately:
#
#   gate       — MUST stay green. Blocks merge. Contains ONLY what passes today.
#   reporting  — the known-red areas (333 type errors, 8 failing test files).
#                Non-blocking, but ratcheted: the budget only ever goes DOWN.
#
# Why not one job that runs everything? Because typecheck and most of the test
# suite are red right now. A CI that is red on day one gets ignored, then
# disabled. Lock in what works, block regressions, shrink the red set.
#
# Every budget below was measured against commit 88768aa. Verify before
# changing — they are meant to be lowered, never raised.
#
# Part 0 contract: routing.golden + single-rule-invariant + money.property are
# the crown jewels. They prove the settlement waterfall behaves identically
# after the money migration (MON-3) and the scale work (SCALE-2). They gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # bun skips devDependencies when NODE_ENV=production, which silently drops
  # typescript and eslint — `typecheck` then fails with "tsc: command not
  # found" (exit 127) instead of a real type error. Pin it.
  NODE_ENV: development

jobs:
  # ══ Tier 1: blocking. Verified green at time of writing. ═══════════════
  gate:
    name: Gate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          # Provider is postgresql. A sqlite URL here is a lie that bites any
          # command that actually connects. generate does not connect, but keep
          # the scheme honest so nothing downstream inherits it.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payswap
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/payswap

      # eslint currently exits 0 with 556 warnings and 0 errors, so it gates.
      # --max-warnings pins the count so the warning debt cannot grow.
      - name: Lint
        run: bunx eslint . --max-warnings 556

      # ── Part 0 contract — the routing identity ──
      # Must never change without a deliberate, reviewed routing change.
      - name: Contract — golden routing
        run: bun test tests/routing.golden.test.ts

      - name: Contract — single routing rule
        run: bun test tests/single-rule-invariant.test.ts

      - name: Contract — money invariants
        run: bun test tests/money.property.test.ts

      # ── Suites green today. Promoting a file here is the ratchet. ──
      - name: Green suites
        run: |
          set -e
          bun test tests/production3/liquidity-network.test.ts
          bun test tests/production3/replay-determinism.test.ts

      # ── SEC-2: every PUBLIC_ROUTES entry is an unauthenticated endpoint ──
      - name: Public API route budget
        run: |
          COUNT=$(grep -cE "^\s*'/api/" src/middleware.ts || true)
          BUDGET=16
          echo "PUBLIC_ROUTES entries: $COUNT (budget $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::PUBLIC_ROUTES grew to $COUNT. Each entry is an endpoint reachable without a session — justify in the PR and raise this budget deliberately."
            exit 1
          fi

  # ══ Tier 2: known-red, reported, ratcheting ════════════════════════════
  typecheck:
    name: Typecheck (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payswap
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/payswap

      # tsconfig includes **/*.ts and excludes only node_modules, so this
      # covers tests/, scripts/, certification/, skills/ and examples/ too.
      # Budget 333 is from commit 88768aa (two rounds ago). Not re-measured
      # this round — tsc OOM-kills in the dev sandbox. CI will measure it.
      # If it changed, lower BUDGET to match.
      - name: Count type errors
        id: tsc
        run: |
          bunx tsc --noEmit > tsc.log 2>&1 || true
          COUNT=$(grep -cE "error TS" tsc.log || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### Type errors: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          grep -oE "^src/[a-z-]+/" tsc.log | sort | uniq -c | sort -rn | head -10 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Ratchet — type errors must not increase
        run: |
          BUDGET=333
          ACTUAL=${{ steps.tsc.outputs.count }}
          echo "Type errors: $ACTUAL (budget $BUDGET)"
          if [ "$ACTUAL" -gt "$BUDGET" ]; then
            echo "::error::Type errors rose to $ACTUAL (budget $BUDGET)."
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BUDGET" ]; then
            echo "::notice::Type errors down to $ACTUAL — lower BUDGET to $ACTUAL in this workflow."
          fi

  suite:
    name: Full suite (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payswap
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/payswap

      # `bun test` now runs all 13 files (process.exit(1) replaced with
      # process.exitCode = 1). But the old test runner prints ✗ marks without
      # always setting the exit code correctly — count assertions, not exit codes.
      - name: Run every test file
        id: suite
        run: |
          FAILING_FILES=0
          TOTAL_FAILS=0
          FAILING=""
          for f in $(find tests -name '*.test.ts' | sort); do
            echo "::group::$f"
            OUTPUT=$(bun test "$f" 2>&1) || true
            FAILS=$(echo "$OUTPUT" | grep -c '✗' || true)
            echo "$OUTPUT"
            if [ "$FAILS" -gt 0 ]; then
              echo "FAIL $f ($FAILS assertions)"
              FAILING_FILES=$((FAILING_FILES + 1))
              TOTAL_FAILS=$((TOTAL_FAILS + FAILS))
              FAILING="$FAILING $f"
            else
              echo "PASS $f"
            fi
            echo "::endgroup::"
          done
          echo "failing_files=$FAILING_FILES" >> "$GITHUB_OUTPUT"
          echo "failing_assertions=$TOTAL_FAILS" >> "$GITHUB_OUTPUT"
          echo "### Failing files: $FAILING_FILES ($TOTAL_FAILS assertions)" >> "$GITHUB_STEP_SUMMARY"
          for f in $FAILING; do echo "- \`$f\`" >> "$GITHUB_STEP_SUMMARY"; done

      # Measured at 7aec9f8: 5 files with failures, 30 failing assertions.
      # The ratchet blocks if either number grows. Lower both when fixing tests.
      - name: Ratchet — failing files must not increase
        run: |
          FILE_BUDGET=5
          ASSERTION_BUDGET=30
          ACTUAL_FILES=${{ steps.suite.outputs.failing_files }}
          ACTUAL_ASSERTIONS=${{ steps.suite.outputs.failing_assertions }}
          echo "Failing files: $ACTUAL_FILES (budget $FILE_BUDGET)"
          echo "Failing assertions: $ACTUAL_ASSERTIONS (budget $ASSERTION_BUDGET)"
          if [ "$ACTUAL_FILES" -gt "$FILE_BUDGET" ]; then
            echo "::error::Failing files rose to $ACTUAL_FILES (budget $FILE_BUDGET) — a previously-passing suite broke."
            exit 1
          fi
          if [ "$ACTUAL_ASSERTIONS" -gt "$ASSERTION_BUDGET" ]; then
            echo "::error::Failing assertions rose to $ACTUAL_ASSERTIONS (budget $ASSERTION_BUDGET)."
            exit 1
          fi
          if [ "$ACTUAL_FILES" -lt "$FILE_BUDGET" ] || [ "$ACTUAL_ASSERTIONS" -lt "$ASSERTION_BUDGET" ]; then
            echo "::notice::Failures down to $ACTUAL_FILES files / $ACTUAL_ASSERTIONS assertions — lower BUDGETs and promote fixed files into the gate job."
          fi

  # ══ Schema drift: a REAL check ═════════════════════════════════════════
  # The previous version diffed prisma/schema.prisma against itself (always
  # empty) and swallowed errors with `|| echo`. It could never fail.
  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Committed migrations must fully describe the schema. --exit-code makes
      # a non-empty diff exit 2 instead of printing and passing.
      - name: Migrations match schema
        run: |
          if [ ! -d prisma/migrations ]; then
            echo "::warning::No prisma/migrations directory — drift check skipped. Add migrations to enable it."
            exit 0
          fi
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code
