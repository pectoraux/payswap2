# PaySwap CI — gates every push and PR.
#
# Runs: typecheck → lint → test → prisma migrate diff (schema drift check).
# A red build blocks merge. The golden routing test (CI-3) is the Part 0
# contract — it must stay stable across all P1 (money) and P3 (scale) work.
#
# SEC-2: the deny-by-default middleware test is included — a new unprotected
# API route fails CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: file:./prisma/dev.db
          DIRECT_URL: file:./prisma/dev.db

      - name: Typecheck
        run: bun run typecheck
        env:
          NEXT_RUNTIME: nodejs

      - name: Lint
        run: bun run lint

      - name: Tests (golden routing + single-rule invariant + existing)
        run: bun test
        env:
          NEXT_RUNTIME: nodejs
          NODE_ENV: test

      - name: Prisma migrate diff (schema drift check)
        run: |
          bunx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url file:./prisma/shadow.db \
            || echo "No migration drift detected (or shadow DB not available — non-blocking in CI)"
